<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Absensi XI TKJ 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --input-bg: rgba(255, 255, 255, 0.8);
            --card-shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-secondary: rgba(30, 30, 46, 0.95);
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --input-bg: rgba(55, 65, 81, 0.8);
            --card-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .login-card {
            backdrop-filter: blur(10px);
            background: var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .text-primary {
            color: var(--text-primary);
        }

        .text-secondary {
            color: var(--text-secondary);
        }

        .border-custom {
            border-color: var(--border-color);
        }

        .input-field {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <!-- Theme Toggle Button -->
    <button 
        id="themeToggle"
        class="fixed top-4 right-4 z-50 w-12 h-12 bg-white dark:bg-gray-800 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform"
        onclick="toggleTheme()"
    >
        <i id="themeIcon" class="fas fa-moon text-gray-800 dark:text-yellow-400 text-xl"></i>
    </button>
    <!-- Card Login -->
    <div class="login-card w-full max-w-md rounded-2xl shadow-2xl p-8 transform transition-all hover:scale-[1.02]">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full mb-4">
                <i class="fas fa-school text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Absensi Kelas</h1>
            <p class="text-gray-600 dark:text-gray-300">XI TKJ 1</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-6">
            <!-- Input Username Modern dengan Icon -->
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-user-circle mr-2 text-blue-500"></i>Nama Panggilan
                </label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400 dark:text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                    </div>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        placeholder="Masukkan nama panggilan kamu..."
                        autocomplete="off"
                        required
                        class="w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 dark:border-gray-700 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none shadow-sm hover:shadow-md hover:border-gray-300 dark:hover:border-gray-600 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                    >
                </div>
            </div>

            <!-- Input Password dengan Toggle Visibility -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-lock mr-2 text-blue-500"></i>Password
                </label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Masukkan password"
                        required
                        class="w-full pl-12 pr-12 py-3.5 border-2 border-gray-200 dark:border-gray-700 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none shadow-sm hover:shadow-md hover:border-gray-300 dark:hover:border-gray-600 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
                    >
                    <button 
                        type="button" 
                        id="togglePassword"
                        class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-blue-500 transition-colors focus:outline-none"
                    >
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Masuk dengan Gradient Modern -->
            <button 
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl hover:from-blue-700 hover:via-purple-700 hover:to-pink-700 transform hover:scale-[1.02] hover:shadow-xl transition-all duration-300 shadow-lg flex items-center justify-center space-x-2 group"
            >
                <i class="fas fa-sign-in-alt group-hover:translate-x-1 transition-transform"></i>
                <span>Masuk ke Dashboard</span>
            </button>
        </form>

        <!-- Error Message Container (Modern Toast-style) -->
        <div id="errorMessage" class="hidden mt-6 p-4 bg-gradient-to-r from-red-50 to-red-100 dark:from-red-900/30 dark:to-red-800/30 border-l-4 border-red-500 rounded-lg shadow-md">
            <div class="flex items-start space-x-3">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-triangle text-red-500 text-xl"></i>
                </div>
                <div class="flex-1">
                    <p id="errorText" class="text-sm text-red-800 dark:text-red-300 font-semibold"></p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
            <p class="text-xs text-gray-500 dark:text-gray-400">
                <i class="fas fa-lock mr-1"></i>Default password: <strong class="text-gray-700 dark:text-gray-300">12345</strong>
            </p>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        // Inisialisasi halaman login
        document.addEventListener('DOMContentLoaded', () => {
            // Toggle show/hide password dengan animasi smooth
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = togglePassword.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
                // Tambahkan efek pulse saat toggle
                togglePassword.classList.add('scale-110');
                setTimeout(() => togglePassword.classList.remove('scale-110'), 150);
            });

            // Handle form submit dengan custom error handling yang modern
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const errorMessage = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                const loginCard = document.querySelector('.login-card');
                
                // Hide error message initially
                errorMessage.classList.add('hidden');
                
                // Trim dan validasi input
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                
                // Efek loading pada tombol
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalBtnContent = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Memproses...';
                
                try {
                    // Validasi input kosong
                    if (!username || !password) {
                        throw new Error('Harap isi semua field!');
                    }
                    
                    // Cari siswa berdasarkan nama dari Supabase (case-insensitive menggunakan ilike)
                    const siswa = await getSiswaByNama(username);
                    
                    if (!siswa) {
                        throw new Error('Nama tidak ditemukan! Periksa kembali nama panggilan kamu.');
                    }
                    
                    // Cek password
                    if (siswa.password !== password) {
                        throw new Error('Password salah! Silakan coba lagi.');
                    }
                    
                    // Login berhasil - simpan sesi dengan timestamp
                    sessionStorage.setItem('currentUser', JSON.stringify(siswa));
                    sessionStorage.setItem('loginTime', new Date().toISOString());
                    
                    // Feedback visual sukses sebelum redirect
                    submitBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Berhasil! Mengalihkan...';
                    submitBtn.classList.remove('from-blue-600', 'via-purple-600', 'to-pink-600');
                    submitBtn.classList.add('from-green-500', 'to-emerald-600');
                    
                    // Redirect berdasarkan role dengan delay singkat untuk feedback
                    setTimeout(() => {
                        if (siswa.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'siswa.html';
                        }
                    }, 800);
                    
                } catch (error) {
                    // Reset tombol
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnContent;
                    submitBtn.classList.add('from-blue-600', 'via-purple-600', 'to-pink-600');
                    submitBtn.classList.remove('from-green-500', 'to-emerald-600');
                    
                    // Tampilkan error dengan animasi shake
                    showError(error.message, errorMessage, errorText, loginCard);
                }
            });
        });
        
        /**
         * Fungsi untuk menampilkan error message dengan animasi shake
         * @param {string} message - Pesan error
         * @param {HTMLElement} errorContainer - Container element error
         * @param {HTMLElement} errorTextElement - Text element error
         * @param {HTMLElement} cardElement - Card element untuk efek shake
         */
        function showError(message, errorContainer, errorTextElement, cardElement) {
            errorTextElement.textContent = message;
            errorContainer.classList.remove('hidden');
            
            // Tambahkan animasi shake pada card
            if (cardElement) {
                cardElement.classList.add('shake-animation');
                setTimeout(() => {
                    cardElement.classList.remove('shake-animation');
                }, 500);
            }
            
            // Auto-hide setelah 5 detik
            setTimeout(() => {
                errorContainer.classList.add('hidden');
            }, 5000);
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            
            // Update icon
            if (newTheme === 'dark') {
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('fa-sun', 'text-yellow-400');
                themeIcon.classList.add('fa-moon', 'text-gray-800');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', savedTheme);
            
            if (savedTheme === 'dark') {
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
            }
        });
    </script>
</body>
</html>
