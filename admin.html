<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Absensi XI TKJ 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --nav-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            --bg-card: rgba(30, 30, 46, 0.95);
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --nav-bg: #1f2937;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .card-dark {
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .text-dark-primary {
            color: var(--text-primary);
        }

        .text-dark-secondary {
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Theme Toggle Button -->
    <button 
        id="themeToggle"
        class="fixed top-20 right-4 z-50 w-12 h-12 bg-white dark:bg-gray-800 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform"
        onclick="toggleTheme()"
    >
        <i id="themeIcon" class="fas fa-moon text-gray-800 dark:text-yellow-400 text-xl"></i>
    </button>
    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-40 transition-colors">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-purple-500 to-pink-600 rounded-full flex items-center justify-center">
                        <i class="fas fa-user-shield text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800 dark:text-white">Panel Admin</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400">XI TKJ 1</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button 
                        onclick="openChangePasswordModal()"
                        class="px-4 py-2 border-2 border-purple-500 text-purple-500 rounded-lg hover:bg-purple-500 hover:text-white transition-all flex items-center space-x-2"
                    >
                        <i class="fas fa-key"></i>
                        <span class="hidden sm:inline">Ganti Password</span>
                    </button>
                    <button 
                        onclick="logout()"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center space-x-2"
                    >
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Banner Sambutan dengan Gradien Fresh -->
    <div class="max-w-7xl mx-auto px-4 mt-6">
        <div id="bannerSambutan" class="bg-gradient-to-r from-violet-500 via-purple-500 to-fuchsia-500 rounded-2xl shadow-xl p-6 text-white transform hover:scale-[1.01] transition-all duration-300">
            <div class="flex items-center space-x-4">
                <div class="flex-shrink-0">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
                        <i id="bannerIcon" class="fas fa-shield-alt text-2xl animate-pulse"></i>
                    </div>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl md:text-2xl font-bold mb-1" id="sambutanText">Selamat Datang, Admin!</h2>
                    <p class="text-white/90 text-sm md:text-base" id="sambutanSubtext">Kelola absensi kelas dengan bijak.</p>
                </div>
                <div class="hidden md:block">
                    <i class="fas fa-crown text-3xl text-yellow-300 animate-spin-slow"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Filter Tanggal & Export -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="flex flex-col sm:flex-row gap-4 items-center w-full md:w-auto">
                    <label for="tanggalFilter" class="text-sm font-medium text-gray-700 whitespace-nowrap">
                        <i class="fas fa-calendar-alt mr-2"></i>Pilih Tanggal:
                    </label>
                    <input 
                        type="date" 
                        id="tanggalFilter"
                        class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 dark:focus:ring-purple-400 outline-none transition-all"
                    >
                </div>
                <button 
                    onclick="exportToCSV()"
                    class="px-6 py-2 bg-gradient-to-r from-blue-500 to-cyan-600 text-white font-semibold rounded-lg hover:from-blue-600 hover:to-cyan-700 transform hover:scale-105 transition-all shadow-lg flex items-center space-x-2"
                >
                    <i class="fas fa-file-csv"></i>
                    <span>Export Harian (CSV)</span>
                </button>
                <button 
                    onclick="exportBulananToCSV()"
                    class="px-6 py-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-lg hover:from-green-600 hover:to-emerald-700 transform hover:scale-105 transition-all shadow-lg flex items-center space-x-2"
                >
                    <i class="fas fa-calendar-alt"></i>
                    <span>Ekspor Bulan Ini</span>
                </button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
            <!-- Hadir -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 transform hover:scale-105 transition-transform">
                <div class="flex items-center justify-between mb-2">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-500"></i>
                    </div>
                </div>
                <p class="text-gray-500 text-sm">Hadir</p>
                <p class="text-3xl font-bold text-green-600" id="countHadir">0</p>
            </div>

            <!-- Izin -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 transform hover:scale-105 transition-transform">
                <div class="flex items-center justify-between mb-2">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-alt text-blue-500"></i>
                    </div>
                </div>
                <p class="text-gray-500 text-sm">Izin</p>
                <p class="text-3xl font-bold text-blue-600" id="countIzin">0</p>
            </div>

            <!-- Sakit -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 transform hover:scale-105 transition-transform">
                <div class="flex items-center justify-between mb-2">
                    <div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-bed text-yellow-500"></i>
                    </div>
                </div>
                <p class="text-gray-500 text-sm">Sakit</p>
                <p class="text-3xl font-bold text-yellow-600" id="countSakit">0</p>
            </div>

            <!-- Alpa -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 transform hover:scale-105 transition-transform">
                <div class="flex items-center justify-between mb-2">
                    <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-times-circle text-red-500"></i>
                    </div>
                </div>
                <p class="text-gray-500 text-sm">Alpa</p>
                <p class="text-3xl font-bold text-red-600" id="countAlpa">0</p>
            </div>

            <!-- Belum Absen -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 transform hover:scale-105 transition-transform">
                <div class="flex items-center justify-between mb-2">
                    <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-question-circle text-gray-500 dark:text-gray-400"></i>
                    </div>
                </div>
                <p class="text-gray-500 text-sm">Belum</p>
                <p class="text-3xl font-bold text-gray-600 dark:text-gray-400" id="countBelum">0</p>
            </div>
        </div>

        <!-- Tabel Rekap -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800 dark:text-white">Rekap Absensi</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400" id="tanggalTampil">-</p>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 dark:bg-gray-900">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">No</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama Siswa</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Waktu</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Alasan</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi Sekretaris</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700" id="tabelSiswa">
                        <!-- Data akan diisi oleh JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Ganti Password -->
    <div id="changePasswordModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full transform transition-all scale-100">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white">
                    <i class="fas fa-key text-purple-500 mr-2"></i>Ganti Password
                </h3>
                <button 
                    onclick="closeChangePasswordModal()"
                    class="text-gray-400 hover:text-gray-600 transition-colors"
                >
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="px-6 py-6 space-y-4">
                <div>
                    <label for="oldPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        Password Lama
                    </label>
                    <input 
                        type="password" 
                        id="oldPassword"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 dark:focus:ring-purple-400 outline-none transition-all"
                        placeholder="Masukkan password lama"
                    >
                </div>
                
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        Password Baru
                    </label>
                    <input 
                        type="password" 
                        id="newPassword"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 dark:focus:ring-purple-400 outline-none transition-all"
                        placeholder="Masukkan password baru"
                    >
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-3">
                <button 
                    onclick="closeChangePasswordModal()"
                    class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 rounded-lg hover:bg-gray-50 dark:bg-gray-900 transition-colors"
                >
                    Batal
                </button>
                <button 
                    onclick="handleChangePassword()"
                    class="px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-pink-700 transition-all shadow-lg"
                >
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        let currentUser = null;
        let selectedDate = '';

        document.addEventListener('DOMContentLoaded', () => {
            // Cek sesi login
            currentUser = checkAuth('admin');
            if (!currentUser) return;

            // Tampilkan banner sambutan dengan pesan dinamis berdasarkan waktu
            tampilkanBannerSambutan(currentUser.namaLengkap);

            // Set tanggal hari ini sebagai default
            selectedDate = getTodayString();
            document.getElementById('tanggalFilter').value = selectedDate;
            
            // Update tampilan tanggal
            updateTanggalTampil(selectedDate);

            // Render tabel dan summary
            renderTabel();
            updateSummary();

            // Event listener untuk perubahan tanggal
            document.getElementById('tanggalFilter').addEventListener('change', (e) => {
                selectedDate = e.target.value;
                updateTanggalTampil(selectedDate);
                renderTabel();
                updateSummary();
            });
        });

        function updateTanggalTampil(tanggal) {
            const dateObj = new Date(tanggal + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalTampil').textContent = dateObj.toLocaleDateString('id-ID', options);
        }

        /**
         * Tampilkan banner sambutan dengan pesan dinamis berdasarkan waktu
         * @param {string} nama - Nama lengkap admin (untuk tampilan yang lebih formal)
         */
        function tampilkanBannerSambutan(nama) {
            const now = new Date();
            const hour = now.getHours();
            let salam, icon, subtext;

            // Tentukan salam berdasarkan waktu
            if (hour >= 4 && hour < 11) {
                // Pagi (04:00 - 10:59)
                salam = `Selamat Pagi, ${nama}! ✨`;
                icon = 'fa-sun';
                subtext = 'Semangat mengelola absensi XI TKJ 1 hari ini.';
            } else if (hour >= 11 && hour < 15) {
                // Siang (11:00 - 14:59)
                salam = `Selamat Siang, ${nama}! 🌤️`;
                icon = 'fa-cloud-sun';
                subtext = 'Tetap teliti dalam mencatat kehadiran siswa.';
            } else if (hour >= 15 && hour < 18) {
                // Sore (15:00 - 17:59)
                salam = `Selamat Sore, ${nama}! 🌅`;
                icon = 'fa-cloud-moon';
                subtext = 'Terima kasih telah mengelola kelas dengan baik.';
            } else {
                // Malam (18:00 - 03:59)
                salam = `Selamat Malam, ${nama}! 🌙`;
                icon = 'fa-moon';
                subtext = 'Istirahat yang cukup untuk besok yang produktif!';
            }

            // Update UI banner
            document.getElementById('sambutanText').textContent = salam;
            document.getElementById('sambutanSubtext').textContent = subtext;
            
            // Update icon dengan animasi
            const bannerIcon = document.getElementById('bannerIcon');
            bannerIcon.className = `fas ${icon} text-2xl animate-pulse`;
        }

        async function renderTabel() {
            const students = await getSiswa();
            const riwayatData = await getRiwayatAbsenByTanggal(selectedDate);
            const tbody = document.getElementById('tabelSiswa');
            
            // Simpan data untuk export
            window.siswaData = students;
            window.riwayatData = riwayatData;
            
            // Gabungkan data siswa dengan riwayat absen
            const mergedData = students.map(siswa => {
                const riwayat = riwayatData.find(r => r.nama_panggilan === siswa.namaPanggilan);
                
                // Format waktu menggunakan fungsi formatWaktu untuk konversi UTC ke WIB
                let waktuDisplay = '-';
                if (riwayat && riwayat.waktu_absen) {
                    waktuDisplay = formatWaktu(riwayat.waktu_absen);
                }
                
                return {
                    ...siswa,
                    statusAbsen: riwayat ? riwayat.status_absen : 'belum',
                    alasan: riwayat ? (riwayat.alasan || '-') : '-',
                    waktu: waktuDisplay
                };
            });
            
            tbody.innerHTML = mergedData.map((siswa, index) => {
                const statusConfig = getStatusConfig(siswa.statusAbsen);
                
                return `
                    <tr class="hover:bg-gray-50 dark:bg-gray-900 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${index + 1}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-medium text-gray-900">${siswa.namaLengkap}</div>
                            <div class="text-sm text-gray-500 dark:text-gray-400">ID: ${siswa.id}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full ${statusConfig.bg} ${statusConfig.text}">
                                ${statusConfig.label}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${siswa.waktu}</td>
                        <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate">${siswa.alasan}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <div class="flex flex-wrap gap-2">
                                <!-- Status Pills -->
                                <div class="flex gap-1">
                                    <button 
                                        onclick="updateStatus('${siswa.id}', '${siswa.namaPanggilan}', 'hadir')"
                                        class="px-2 py-1 text-xs rounded-full transition-all ${siswa.statusAbsen === 'hadir' ? 'bg-green-500 text-white ring-2 ring-green-300' : 'bg-green-100 text-green-700 hover:bg-green-200'}"
                                        title="Hadir"
                                    >
                                        H
                                    </button>
                                    <button 
                                        onclick="updateStatus('${siswa.id}', '${siswa.namaPanggilan}', 'izin')"
                                        class="px-2 py-1 text-xs rounded-full transition-all ${siswa.statusAbsen === 'izin' ? 'bg-blue-500 text-white ring-2 ring-blue-300' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}"
                                        title="Izin"
                                    >
                                        I
                                    </button>
                                    <button 
                                        onclick="updateStatus('${siswa.id}', '${siswa.namaPanggilan}', 'sakit')"
                                        class="px-2 py-1 text-xs rounded-full transition-all ${siswa.statusAbsen === 'sakit' ? 'bg-yellow-500 text-white ring-2 ring-yellow-300' : 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'}"
                                        title="Sakit"
                                    >
                                        S
                                    </button>
                                    <button 
                                        onclick="updateStatus('${siswa.id}', '${siswa.namaPanggilan}', 'alpa')"
                                        class="px-2 py-1 text-xs rounded-full transition-all ${siswa.statusAbsen === 'alpa' ? 'bg-red-500 text-white ring-2 ring-red-300' : 'bg-red-100 text-red-700 hover:bg-red-200'}"
                                        title="Alpa"
                                    >
                                        A
                                    </button>
                                </div>
                                
                                <!-- Reset Password Button -->
                                <button 
                                    onclick="resetPassword('${siswa.id}', '${siswa.namaPanggilan}')"
                                    class="px-2 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors"
                                    title="Reset Password"
                                >
                                    <i class="fas fa-key"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateSummary() {
            const students = await getSiswa();
            const riwayatData = await getRiwayatAbsenByTanggal(selectedDate);
            
            let countHadir = 0, countIzin = 0, countSakit = 0, countAlpa = 0, countBelum = 0;
            
            students.forEach(siswa => {
                const riwayat = riwayatData.find(r => r.nama_panggilan === siswa.namaPanggilan);
                const status = riwayat ? riwayat.status_absen : 'belum';
                
                if (status === 'belum') {
                    countBelum++;
                } else if (status === 'hadir') {
                    countHadir++;
                } else if (status === 'izin') {
                    countIzin++;
                } else if (status === 'sakit') {
                    countSakit++;
                } else if (status === 'alpa') {
                    countAlpa++;
                }
            });
            
            document.getElementById('countHadir').textContent = countHadir;
            document.getElementById('countIzin').textContent = countIzin;
            document.getElementById('countSakit').textContent = countSakit;
            document.getElementById('countAlpa').textContent = countAlpa;
            document.getElementById('countBelum').textContent = countBelum;
        }

        async function updateStatus(studentId, namaSiswa, newStatus) {
            const success = await upsertRiwayatAbsen(namaSiswa, selectedDate, newStatus);
            
            if (success) {
                // Re-render tabel dan summary setelah update berhasil
                await renderTabel();
                await updateSummary();
                
                // Feedback visual
                const statusNames = { hadir: 'Hadir', izin: 'Izin', sakit: 'Sakit', alpa: 'Alpa' };
                alert(`✅ Status berhasil diubah menjadi ${statusNames[newStatus]}`);
            }
        }

        async function resetPassword(studentId, namaSiswa) {
            if (confirm(`Apakah Anda yakin ingin mereset password ${namaSiswa} ke default (12345)?`)) {
                const success = await resetPasswordSiswa(studentId);
                
                if (success) {
                    alert(`✅ Password ${namaSiswa} berhasil direset!`);
                }
            }
        }

        function getStatusConfig(status) {
            // Status sekarang langsung: 'hadir', 'izin', 'sakit', 'alpa', 'belum'
            const configs = {
                hadir: { bg: 'bg-green-100', text: 'text-green-800', label: 'Hadir' },
                izin: { bg: 'bg-blue-100', text: 'text-blue-800', label: 'Izin' },
                sakit: { bg: 'bg-yellow-100', text: 'text-yellow-800', label: 'Sakit' },
                alpa: { bg: 'bg-red-100', text: 'text-red-800', label: 'Alpa' },
                belum: { bg: 'bg-gray-100', text: 'text-gray-800', label: 'Belum' }
            };
            return configs[status] || configs.belum;
        }

        // Fungsi untuk Modal Ganti Password
        function openChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.add('hidden');
            // Reset input fields
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
        }

        async function handleChangePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            // Validasi input
            if (!oldPassword || !newPassword) {
                alert('⚠️ Mohon isi semua field!');
                return;
            }

            if (newPassword.length < 4) {
                alert('⚠️ Password baru minimal 4 karakter!');
                return;
            }

            // Ambil admin yang sedang login dari sessionStorage
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('⚠️ Sesi tidak ditemukan. Silakan login ulang.');
                window.location.href = 'index.html';
                return;
            }

            // Cek password lama di database
            const { data: adminData, error } = await supabaseClient
                .from('siswa')
                .select('password')
                .eq('nama_panggilan', currentUser.namaPanggilan)
                .single();

            if (error || !adminData) {
                alert('⚠️ Data admin tidak ditemukan!');
                return;
            }

            // Verifikasi password lama
            if (adminData.password !== oldPassword) {
                alert('❌ Password lama salah!');
                return;
            }

            // Update password baru
            const { error: updateError } = await supabaseClient
                .from('siswa')
                .update({ password: newPassword })
                .eq('nama_panggilan', currentUser.namaPanggilan);

            if (updateError) {
                alert('⚠️ Gagal mengubah password. Silakan coba lagi.');
                console.error('Error update password:', updateError);
                return;
            }

            // Sukses
            alert('✅ Password berhasil diubah!');
            closeChangePasswordModal();
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            
            if (newTheme === 'dark') {
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('fa-sun', 'text-yellow-400');
                themeIcon.classList.add('fa-moon', 'text-gray-800');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', savedTheme);
            
            if (savedTheme === 'dark') {
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
            }
        });

    </script>
</body>
</html>
