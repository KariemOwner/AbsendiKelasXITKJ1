<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siswa - Absensi XI TKJ 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
            --nav-bg: #ffffff;
        }

        .dark {
            --bg-primary: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            --bg-card: rgba(30, 30, 46, 0.95);
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --nav-bg: #1f2937;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .modal {
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.5);
        }

        .card-dark {
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .text-dark-primary {
            color: var(--text-primary);
        }

        .text-dark-secondary {
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-40 transition-colors">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800 dark:text-white">Halo, <span id="namaSiswa">-</span>!</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400">XI TKJ 1</p>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button 
                        onclick="openModal('passwordModal')"
                        class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors flex items-center space-x-2"
                    >
                        <i class="fas fa-key"></i>
                        <span class="hidden sm:inline">Ganti Password</span>
                    </button>
                    <button 
                        onclick="logout()"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center space-x-2"
                    >
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                    <!-- Theme Toggle Button - Inside Navbar -->
                    <button 
                        id="themeToggle"
                        class="w-10 h-10 bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center hover:scale-110 transition-transform"
                        onclick="toggleTheme()"
                        title="Toggle Theme"
                    >
                        <i id="themeIcon" class="fas fa-moon text-gray-800 dark:text-yellow-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Banner Sambutan dengan Gradien Fresh -->
    <div class="max-w-6xl mx-auto px-4 mt-6">
        <div id="bannerSambutan" class="bg-gradient-to-r from-emerald-400 via-teal-500 to-cyan-600 rounded-2xl shadow-xl p-6 text-white transform hover:scale-[1.01] transition-all duration-300">
            <div class="flex items-center space-x-4">
                <div class="flex-shrink-0">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
                        <i id="bannerIcon" class="fas fa-sun text-2xl animate-pulse"></i>
                    </div>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl md:text-2xl font-bold mb-1" id="sambutanText">Selamat Datang!</h2>
                    <p class="text-white/90 text-sm md:text-base" id="sambutanSubtext">Semangat belajar hari ini!</p>
                </div>
                <div class="hidden md:block">
                    <i class="fas fa-sparkles text-3xl text-yellow-300 animate-spin-slow"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Tanggal -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-6">
            <div class="text-center">
                <p class="text-gray-500 text-sm mb-2">Hari ini adalah</p>
                <h2 class="text-3xl font-bold text-gray-800 dark:text-white" id="tanggalHariIni">-</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2" id="waktuHariIni">-</p>
            </div>
        </div>

        <!-- Status Absensi Hari Ini -->
        <div id="statusContainer" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-6">
            <!-- Akan diisi oleh JavaScript -->
        </div>

        <!-- Call to Action - Tombol Absen -->
        <div id="absenContainer" class="space-y-4">
            <button 
                id="btnAbsenHadir"
                onclick="absenHadir()"
                class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-8 rounded-2xl text-2xl hover:from-green-600 hover:to-emerald-700 transform hover:scale-[1.02] transition-all shadow-xl flex items-center justify-center space-x-4"
            >
                <i class="fas fa-check-circle text-3xl"></i>
                <span>ABSEN HADIR SEKARANG</span>
            </button>

            <div class="text-center">
                <button 
                    onclick="openModal('izinModal')"
                    class="text-blue-600 hover:text-blue-800 font-medium underline transition-colors"
                >
                    <i class="fas fa-file-alt mr-2"></i>Lapor Sakit / Izin
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Ganti Password -->
    <div id="passwordModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 dark:text-white">Ganti Password</h3>
                <button onclick="closeModal('passwordModal')" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="gantiPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password Lama</label>
                    <input 
                        type="password" 
                        id="passwordLama"
                        required
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 outline-none"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password Baru</label>
                    <input 
                        type="password" 
                        id="passwordBaru"
                        required
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 outline-none"
                    >
                </div>
                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button"
                        onclick="closeModal('passwordModal')"
                        class="flex-1 px-4 py-3 bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-400 transition-colors font-semibold"
                    >
                        Batal
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                    >
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Lapor Sakit/Izin -->
    <div id="izinModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 dark:text-white">Lapor Sakit / Izin</h3>
                <button onclick="closeModal('izinModal')" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="izinForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Jenis Keterangan</label>
                    <select 
                        id="jenisIzin"
                        required
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 outline-none"
                    >
                        <option value="">-- Pilih --</option>
                        <option value="sakit">Sakit</option>
                        <option value="izin">Izin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Alasan</label>
                    <textarea 
                        id="alasanIzin"
                        rows="4"
                        required
                        placeholder="Tuliskan alasan Anda..."
                        class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 outline-none resize-none"
                    ></textarea>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button"
                        onclick="closeModal('izinModal')"
                        class="flex-1 px-4 py-3 bg-gray-300 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-400 transition-colors font-semibold"
                    >
                        Batal
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                    >
                        Kirim
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- AI Class Assistant - Floating Chat Widget -->
    <div id="aiChatWidget">
        <!-- Floating Action Button (FAB) -->
        <button 
            id="aiChatFab"
            onclick="toggleChatWindow()"
            class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all duration-300 group"
            title="AI Class Assistant"
        >
            <i class="fas fa-robot text-white text-2xl"></i>
        </button>

        <!-- Chat Window -->
        <div 
            id="aiChatWindow"
            class="fixed bottom-24 right-6 z-50 w-80 md:w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl hidden flex-col overflow-hidden border border-gray-200 dark:border-gray-700"
        >
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-white text-sm"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-sm">Qwen TKJ 1 Assistant</h3>
                        <p class="text-white/80 text-xs">Online</p>
                    </div>
                </div>
                <button 
                    onclick="toggleChatWindow()"
                    class="text-white/80 hover:text-white transition-colors"
                >
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- Chat Messages Area -->
            <div 
                id="aiChatMessages"
                class="flex-1 p-4 h-64 overflow-y-auto bg-gray-50 dark:bg-gray-900 space-y-3"
            >
                <!-- Default Bot Message -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none px-3 py-2 shadow-sm max-w-[80%]">
                        <p class="text-sm text-gray-800 dark:text-gray-200">Halo! 👋 Saya Qwen, asisten AI kelas XI TKJ 1. Ada yang bisa saya bantu?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="px-4 py-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center space-x-2">
                    <input 
                        type="text" 
                        id="chatInput"
                        placeholder="Ketik pesan..."
                        class="flex-1 px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded-full text-sm text-gray-800 dark:text-gray-200 outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <button 
                        id="sendChatBtn"
                        class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full flex items-center justify-center hover:scale-110 transition-transform"
                    >
                        <i class="fas fa-paper-plane text-white text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Cek sesi login
            currentUser = checkAuth('siswa');
            if (!currentUser) return;

            // Tampilkan nama siswa dengan nama lengkap
            document.getElementById('namaSiswa').textContent = currentUser.namaLengkap;

            // Tampilkan banner sambutan dengan pesan dinamis berdasarkan waktu
            tampilkanBannerSambutan(currentUser.namaLengkap);

            // Tampilkan tanggal
            updateTanggal();

            // Render status absensi
            renderStatusAbsen();

            // Handle form ganti password
            document.getElementById('gantiPasswordForm').addEventListener('submit', handleGantiPassword);

            // Handle form izin/sakit
            document.getElementById('izinForm').addEventListener('submit', handleIzin);
        });

        /**
         * Tampilkan banner sambutan dengan pesan dinamis berdasarkan waktu
         * @param {string} nama - Nama lengkap siswa
         */
        function tampilkanBannerSambutan(nama) {
            const now = new Date();
            const hour = now.getHours();
            let salam, icon, subtext;

            // Tentukan salam berdasarkan waktu
            if (hour >= 4 && hour < 11) {
                // Pagi (04:00 - 10:59)
                salam = `Selamat Pagi, ${nama}! ✨`;
                icon = 'fa-sun';
                subtext = 'Jangan lupa senyum hari ini di kelas XI TKJ 1.';
            } else if (hour >= 11 && hour < 15) {
                // Siang (11:00 - 14:59)
                salam = `Selamat Siang, ${nama}! 🌤️`;
                icon = 'fa-cloud-sun';
                subtext = 'Tetap semangat belajar dan jangan lupa ibadah!';
            } else if (hour >= 15 && hour < 18) {
                // Sore (15:00 - 17:59)
                salam = `Selamat Sore, ${nama}! 🌅`;
                icon = 'fa-cloud-moon';
                subtext = 'Waktunya menyelesaikan tugas-tugas hari ini.';
            } else {
                // Malam (18:00 - 03:59)
                salam = `Selamat Malam, ${nama}! 🌙`;
                icon = 'fa-moon';
                subtext = 'Istirahat yang cukup untuk besok yang cerah!';
            }

            // Update UI banner
            document.getElementById('sambutanText').textContent = salam;
            document.getElementById('sambutanSubtext').textContent = subtext;
            
            // Update icon dengan animasi
            const bannerIcon = document.getElementById('bannerIcon');
            bannerIcon.className = `fas ${icon} text-2xl animate-pulse`;
        }

        function updateTanggal() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalHariIni').textContent = now.toLocaleDateString('id-ID', options);
            document.getElementById('waktuHariIni').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        async function renderStatusAbsen() {
            const statusContainer = document.getElementById('statusContainer');
            const absenContainer = document.getElementById('absenContainer');
            
            // Ambil data dari riwayat_absen untuk hari ini
            const today = getTodayString();
            const riwayatData = await getRiwayatAbsenByTanggal(today);
            
            // Cari data siswa ini di riwayat
            const siswaRecord = riwayatData.find(r => r.nama_panggilan === currentUser.namaPanggilan);
            
            if (siswaRecord && siswaRecord.status_absen) {
                // Sudah absen
                const status = siswaRecord.status_absen;
                let statusColor = 'gray';
                let statusIcon = 'question-circle';
                let statusText = 'Belum Absen';

                if (status === 'hadir') {
                    statusColor = 'green';
                    statusIcon = 'check-circle';
                    statusText = 'Hadir';
                } else if (status === 'sakit') {
                    statusColor = 'yellow';
                    statusIcon = 'bed';
                    statusText = 'Sakit';
                } else if (status === 'izin') {
                    statusColor = 'blue';
                    statusIcon = 'file-alt';
                    statusText = 'Izin';
                } else if (status === 'alpa') {
                    statusColor = 'red';
                    statusIcon = 'times-circle';
                    statusText = 'Alpa';
                }

                statusContainer.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-${statusColor}-100 dark:bg-${statusColor}-900/30 rounded-full mb-4">
                            <i class="fas fa-${statusIcon} text-${statusColor}-500 text-3xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Status: ${statusText}</h3>
                        <p class="text-gray-500 dark:text-gray-400 mt-2">Terakhir diupdate: ${new Date().toLocaleString('id-ID')}</p>
                    </div>
                `;

                // Sembunyikan tombol absen jika sudah absen
                absenContainer.classList.add('hidden');
            } else {
                // Belum absen
                statusContainer.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 dark:bg-gray-700 rounded-full mb-4">
                            <i class="fas fa-question-circle text-gray-400 dark:text-gray-500 text-3xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Belum Absen</h3>
                        <p class="text-gray-600 dark:text-gray-400">Silakan lakukan absensi kehadiran atau lapor sakit/izin</p>
                    </div>
                `;
            }
        }

        function absenHadir() {
            // Upsert ke tabel riwayat_absen
            const today = getTodayString();
            upsertRiwayatAbsen(currentUser.namaPanggilan, today, 'hadir')
                .then(success => {
                    if (success) {
                        alert('✅ Absensi berhasil! Anda telah tercatat HADIR.');
                        renderStatusAbsen();
                    }
                });
        }

        async function handleIzin(e) {
            e.preventDefault();
            
            const jenisIzin = document.getElementById('jenisIzin').value;
            const alasanIzin = document.getElementById('alasanIzin').value;

            // Upsert ke tabel riwayat_absen dengan alasan
            const today = getTodayString();
            const success = await upsertRiwayatAbsen(currentUser.namaPanggilan, today, jenisIzin, alasanIzin);
            
            if (success) {
                closeModal('izinModal');
                alert(`✅ Laporan ${jenisIzin} berhasil dikirim.`);
                renderStatusAbsen();
                document.getElementById('izinForm').reset();
            }
        }

        async function handleGantiPassword(e) {
            e.preventDefault();
            
            const passwordLama = document.getElementById('passwordLama').value;
            const passwordBaru = document.getElementById('passwordBaru').value;

            // Validasi password lama
            if (passwordLama !== currentUser.password) {
                alert('❌ Password lama salah!');
                return;
            }

            // Update password di Supabase
            const success = await updatePasswordSiswa(currentUser.id, passwordBaru);
            
            if (success) {
                // Update current user di sesi
                currentUser.password = passwordBaru;
                sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                closeModal('passwordModal');
                alert('✅ Password berhasil diubah!');
                document.getElementById('gantiPasswordForm').reset();
            }
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.classList.remove('fa-sun', 'text-yellow-400');
                themeIcon.classList.add('fa-moon', 'text-gray-800');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'dark') {
                html.classList.add('dark');
                themeIcon.classList.remove('fa-moon', 'text-gray-800');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
            }
        });

        // AI Chat Widget Functions
        let chatWindowOpen = false;

        function toggleChatWindow() {
            const chatWindow = document.getElementById('aiChatWindow');
            const chatFab = document.getElementById('aiChatFab');
            
            if (chatWindowOpen) {
                chatWindow.classList.add('hidden');
                chatFab.classList.remove('scale-0');
            } else {
                chatWindow.classList.remove('hidden');
                chatWindow.classList.add('flex');
            }
            
            chatWindowOpen = !chatWindowOpen;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if (!input) {
                console.error("Elemen input chat tidak ditemukan!");
                return;
            }
            const message = input.value.trim();
            
            if (!message) return;
            
            const messagesContainer = document.getElementById('aiChatMessages');
            
            // Add user message bubble
            const userMessageHtml = `
                <div class="flex items-start justify-end space-x-2">
                    <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl rounded-tr-none px-3 py-2 shadow-sm max-w-[80%]">
                        <p class="text-sm text-white">${escapeHtml(message)}</p>
                    </div>
                    <div class="w-8 h-8 bg-gray-300 dark:bg-gray-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-user text-gray-600 dark:text-gray-300 text-xs"></i>
                    </div>
                </div>
            `;
            
            messagesContainer.insertAdjacentHTML('beforeend', userMessageHtml);
            
            // Clear input and scroll to bottom
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
