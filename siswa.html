<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siswa - Absensi XI TKJ 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .modal {
            backdrop-filter: blur(5px);
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Halo, <span id="namaSiswa">-</span>!</h1>
                        <p class="text-sm text-gray-500">XI TKJ 1</p>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button 
                        onclick="openModal('passwordModal')"
                        class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors flex items-center space-x-2"
                    >
                        <i class="fas fa-key"></i>
                        <span class="hidden sm:inline">Ganti Password</span>
                    </button>
                    <button 
                        onclick="logout()"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center space-x-2"
                    >
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Tanggal -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="text-center">
                <p class="text-gray-500 text-sm mb-2">Hari ini adalah</p>
                <h2 class="text-3xl font-bold text-gray-800" id="tanggalHariIni">-</h2>
                <p class="text-gray-600 mt-2" id="waktuHariIni">-</p>
            </div>
        </div>

        <!-- Status Absensi Hari Ini -->
        <div id="statusContainer" class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <!-- Akan diisi oleh JavaScript -->
        </div>

        <!-- Call to Action - Tombol Absen -->
        <div id="absenContainer" class="space-y-4">
            <button 
                id="btnAbsenHadir"
                onclick="absenHadir()"
                class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-8 rounded-2xl text-2xl hover:from-green-600 hover:to-emerald-700 transform hover:scale-[1.02] transition-all shadow-xl flex items-center justify-center space-x-4"
            >
                <i class="fas fa-check-circle text-3xl"></i>
                <span>ABSEN HADIR SEKARANG</span>
            </button>

            <div class="text-center">
                <button 
                    onclick="openModal('izinModal')"
                    class="text-blue-600 hover:text-blue-800 font-medium underline transition-colors"
                >
                    <i class="fas fa-file-alt mr-2"></i>Lapor Sakit / Izin
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Ganti Password -->
    <div id="passwordModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Ganti Password</h3>
                <button onclick="closeModal('passwordModal')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="gantiPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password Lama</label>
                    <input 
                        type="password" 
                        id="passwordLama"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password Baru</label>
                    <input 
                        type="password" 
                        id="passwordBaru"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>
                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button"
                        onclick="closeModal('passwordModal')"
                        class="flex-1 px-4 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-semibold"
                    >
                        Batal
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                    >
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Lapor Sakit/Izin -->
    <div id="izinModal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Lapor Sakit / Izin</h3>
                <button onclick="closeModal('izinModal')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="izinForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Jenis Keterangan</label>
                    <select 
                        id="jenisIzin"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                        <option value="">-- Pilih --</option>
                        <option value="sakit">Sakit</option>
                        <option value="izin">Izin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Alasan</label>
                    <textarea 
                        id="alasanIzin"
                        rows="4"
                        required
                        placeholder="Tuliskan alasan Anda..."
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"
                    ></textarea>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button"
                        onclick="closeModal('izinModal')"
                        class="flex-1 px-4 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-semibold"
                    >
                        Batal
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold"
                    >
                        Kirim
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Cek sesi login
            currentUser = checkAuth('siswa');
            if (!currentUser) return;

            // Tampilkan nama siswa
            document.getElementById('namaSiswa').textContent = currentUser.namaPanggilan;

            // Tampilkan tanggal
            updateTanggal();

            // Render status absensi
            renderStatusAbsen();

            // Handle form ganti password
            document.getElementById('gantiPasswordForm').addEventListener('submit', handleGantiPassword);

            // Handle form izin/sakit
            document.getElementById('izinForm').addEventListener('submit', handleIzin);
        });

        function updateTanggal() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalHariIni').textContent = now.toLocaleDateString('id-ID', options);
            document.getElementById('waktuHariIni').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function renderStatusAbsen() {
            const statusContainer = document.getElementById('statusContainer');
            const absenContainer = document.getElementById('absenContainer');
            
            const today = getTodayString();
            const statusKey = `absen_${today}`;
            const allData = JSON.parse(localStorage.getItem(statusKey)) || {};
            const studentStatus = allData[currentUser.id];

            if (studentStatus) {
                // Sudah absen
                let statusColor = 'gray';
                let statusIcon = 'question-circle';
                let statusText = 'Belum Absen';

                if (studentStatus.status === 'hadir') {
                    statusColor = 'green';
                    statusIcon = 'check-circle';
                    statusText = 'Hadir';
                } else if (studentStatus.status === 'sakit') {
                    statusColor = 'yellow';
                    statusIcon = 'bed';
                    statusText = 'Sakit';
                } else if (studentStatus.status === 'izin') {
                    statusColor = 'blue';
                    statusIcon = 'file-alt';
                    statusText = 'Izin';
                } else if (studentStatus.status === 'alpa') {
                    statusColor = 'red';
                    statusIcon = 'times-circle';
                    statusText = 'Alpa';
                }

                statusContainer.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-${statusColor}-100 rounded-full mb-4">
                            <i class="fas fa-${statusIcon} text-${statusColor}-500 text-3xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">Status: ${statusText}</h3>
                        ${studentStatus.alasan ? `<p class="text-gray-600">Alasan: ${studentStatus.alasan}</p>` : ''}
                        <p class="text-gray-500 mt-2">${studentStatus.waktu}</p>
                    </div>
                `;

                // Sembunyikan tombol absen jika sudah absen
                if (studentStatus.status !== 'belum') {
                    absenContainer.classList.add('hidden');
                }
            } else {
                // Belum absen
                statusContainer.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mb-4">
                            <i class="fas fa-question-circle text-gray-400 text-3xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">Belum Absen</h3>
                        <p class="text-gray-600">Silakan lakukan absensi kehadiran atau lapor sakit/izin</p>
                    </div>
                `;
            }
        }

        function absenHadir() {
            const today = getTodayString();
            const statusKey = `absen_${today}`;
            const allData = JSON.parse(localStorage.getItem(statusKey)) || {};
            
            allData[currentUser.id] = {
                status: 'hadir',
                waktu: new Date().toLocaleString('id-ID'),
                alasan: ''
            };

            localStorage.setItem(statusKey, JSON.stringify(allData));
            
            alert('✅ Absensi berhasil! Anda telah tercatat HADIR.');
            renderStatusAbsen();
        }

        function handleIzin(e) {
            e.preventDefault();
            
            const jenisIzin = document.getElementById('jenisIzin').value;
            const alasanIzin = document.getElementById('alasanIzin').value;

            const today = getTodayString();
            const statusKey = `absen_${today}`;
            const allData = JSON.parse(localStorage.getItem(statusKey)) || {};
            
            allData[currentUser.id] = {
                status: jenisIzin,
                waktu: new Date().toLocaleString('id-ID'),
                alasan: alasanIzin
            };

            localStorage.setItem(statusKey, JSON.stringify(allData));
            
            closeModal('izinModal');
            alert(`✅ Laporan ${jenisIzin} berhasil dikirim.`);
            renderStatusAbsen();
        }

        function handleGantiPassword(e) {
            e.preventDefault();
            
            const passwordLama = document.getElementById('passwordLama').value;
            const passwordBaru = document.getElementById('passwordBaru').value;

            // Validasi password lama
            if (passwordLama !== currentUser.password) {
                alert('❌ Password lama salah!');
                return;
            }

            // Update password
            const students = getSiswa();
            const studentIndex = students.findIndex(s => s.id === currentUser.id);
            
            if (studentIndex !== -1) {
                students[studentIndex].password = passwordBaru;
                localStorage.setItem('xi_tkj_1_siswa', JSON.stringify(students));
                
                // Update current user
                currentUser.password = passwordBaru;
                
                closeModal('passwordModal');
                alert('✅ Password berhasil diubah!');
                document.getElementById('gantiPasswordForm').reset();
            }
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }
    </script>
</body>
</html>
